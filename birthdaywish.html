<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Purrfect Birthday Wishes</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Floating cat paws background */
        body::before {
            content: '🐾';
            position: absolute;
            font-size: 60px;
            opacity: 0.15;
            animation: float 20s infinite linear;
            top: 10%;
            left: 10%;
        }

        body::after {
            content: '🐾';
            position: absolute;
            font-size: 80px;
            opacity: 0.1;
            animation: float 25s infinite linear reverse;
            top: 60%;
            right: 15%;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0px) rotate(360deg); }
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            padding: 50px 40px;
            position: relative;
            animation: slideIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .cat-ears {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
            animation: wiggle 2s infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-50%) rotate(-5deg); }
            75% { transform: translateX(-50%) rotate(5deg); }
        }

        h1 {
            font-family: 'Caveat', cursive;
            font-size: 3em;
            color: #ff6b9d;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(255, 107, 157, 0.3);
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 3px solid #ffc3d5;
            border-radius: 15px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1em;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #ff6b9d;
            box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.1);
            transform: translateY(-2px);
        }

        .upload-area {
            border: 3px dashed #ffc3d5;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: #fff9fc;
        }

        .upload-area:hover {
            border-color: #ff6b9d;
            background: #fff0f6;
            transform: scale(1.02);
        }

        .upload-area.dragover {
            border-color: #ff6b9d;
            background: #ffe6f0;
            transform: scale(1.02);
        }

        input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #666;
            font-size: 1em;
        }

        .preview-container {
            margin-top: 20px;
            text-align: center;
        }

        .preview-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.5);
        }

        button:active {
            transform: translateY(-1px);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .wish-card {
            display: none;
            animation: wishAppear 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes wishAppear {
            from {
                opacity: 0;
                transform: rotateY(90deg);
            }
            to {
                opacity: 1;
                transform: rotateY(0);
            }
        }

        .wish-card.active {
            display: block;
        }

        .user-photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 30px;
            display: block;
            border: 6px solid #ff6b9d;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
            animation: photoZoom 1.2s ease;
        }

        @keyframes photoZoom {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .wish-message {
            font-family: 'Caveat', cursive;
            font-size: 2em;
            color: #333;
            text-align: center;
            line-height: 1.6;
            margin: 20px 0;
            animation: messageSlide 1s ease 0.5s both;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .cats-animation {
            text-align: center;
            font-size: 3em;
            margin: 20px 0;
            animation: catsParade 2s ease infinite;
        }

        @keyframes catsParade {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff6b9d;
            position: absolute;
            animation: confettiFall 3s linear infinite;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .back-button {
            background: linear-gradient(135deg, #a8a8a8 0%, #c4c4c4 100%);
            margin-top: 20px;
        }

        .back-button:hover {
            box-shadow: 0 10px 30px rgba(168, 168, 168, 0.5);
        }

        .emoji-decoration {
            display: inline-block;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="container" id="formContainer">
        <div class="cat-ears">🐱</div>
        <h1>Purrfect Birthday! <span class="emoji-decoration">🎉</span></h1>
        <p class="subtitle">Someone special has a birthday wish for you!</p>

        <form id="birthdayForm">
            <div class="form-group">
                <label for="name">What's your name? 😸</label>
                <input type="text" id="name" placeholder="Enter your name..." required>
            </div>

            <div class="form-group">
                <label for="photo">Share your lovely photo! 📸</label>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">🖼️</div>
                    <div class="upload-text">Click or drag your photo here</div>
                    <input type="file" id="photo" accept="image/*" required>
                </div>
                <div class="preview-container" id="previewContainer"></div>
            </div>

            <button type="submit" id="submitBtn">
                See Your Birthday Wish! 🎂
            </button>
        </form>
    </div>

    <div class="container wish-card" id="wishCard">
        <div class="cat-ears">🐱</div>
        <div id="wishContent"></div>
        <button class="back-button" onclick="location.reload()">
            Send to Another Friend 💌
        </button>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const photoInput = document.getElementById('photo');
        const previewContainer = document.getElementById('previewContainer');
        const form = document.getElementById('birthdayForm');
        let uploadedImage = null;

        // Upload area interactions
        uploadArea.addEventListener('click', () => photoInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                photoInput.files = files;
                handleFileSelect();
            }
        });

        photoInput.addEventListener('change', handleFileSelect);

        function handleFileSelect() {
            const file = photoInput.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadedImage = e.target.result;
                    previewContainer.innerHTML = `<img src="${uploadedImage}" class="preview-image" alt="Preview">`;
                };
                reader.readAsDataURL(file);
            }
        }

        // Form submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();

            if (!name || !uploadedImage) {
                alert('Please enter your name and upload a photo! 🐱');
                return;
            }

            showBirthdayWish(name, uploadedImage);
        });

        function showBirthdayWish(name, imageUrl) {
            const wishes = [
                `Happy Birthday, ${name}! 🎉 May your day be filled with purrs, cuddles, and all the catnip you can handle! You're absolutely paw-some! 🐾`,
                `Meow-velous Birthday, ${name}! 🎂 Here's to another year of being the cat's meow! May your day be filled with sunshine, treats, and endless head scritches! 😺`,
                `Happy Purrthday, ${name}! 🎈 You're not getting older, you're just becoming a more refined feline! Wishing you a day full of warm laps and happy naps! 🐱`,
                `It's your special day, ${name}! 🎊 May you have nine lives' worth of happiness, love, and all the fish you could ever want! Stay paw-sitive! 🐟`,
                `Happy Birthday to the coolest cat, ${name}! 🎁 May your year ahead be filled with adventure, mischief, and plenty of cardboard boxes to explore! 📦✨`
            ];

            const randomWish = wishes[Math.floor(Math.random() * wishes.length)];

            const wishContent = document.getElementById('wishContent');
            wishContent.innerHTML = `
                <img src="${imageUrl}" class="user-photo" alt="${name}">
                <div class="cats-animation">🐱🎉🐱🎂🐱</div>
                <div class="wish-message">${randomWish}</div>
                <div class="cats-animation">🎁🐾🎈🐾🎁</div>
            `;

            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('wishCard').classList.add('active');

            createConfetti();
        }

        function createConfetti() {
            const colors = ['#ff6b9d', '#ffc3d5', '#ffeb3b', '#4caf50', '#2196f3', '#ff9800'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    confetti.style.animationDelay = Math.random() + 's';
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 5000);
                }, i * 50);
            }
        }
    </script>
</body>
</html>
